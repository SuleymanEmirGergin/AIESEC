name: Veri yenileme

# Aylik: OSM (Overpass) ingest + Overture zenginlestirme, dogrudan canli
# veritabanina. Elle de baslatilabilir (Actions > Veri yenileme > Run).
on:
  schedule:
    - cron: "0 1 1 * *" # her ayin 1'i, 04:00 TR
  workflow_dispatch:
    inputs:
      force:
        description: "Taze ilceleri de yeniden cek (OSM)"
        type: boolean
        default: false
      kontrol:
        description: "Sadece veritabani baglantisini kontrol et (1 dk; veri yenilemez)"
        type: boolean
        default: false

# Is akisinin GitHub anahtari yalnizca kodu okuyabilir.
permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 80 ilce ~3,5 saat; GitHub'in siniri 6 saat.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend
    # DATABASE_URL yalnizca ona ihtiyac duyan adimlarda: paket kurulumu
    # sirasinda (ucuncu taraf kodu calisirken) ortamda bulunmasin.
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Veritabani adresi tanimli mi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret'i eksik"; exit 1; }

      - name: Baglanti kontrolu
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from app.database import make_engine
          async def main():
              engine = make_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as c:
                  places = await c.scalar(text("select count(*) from places"))
                  saved = await c.scalar(text("select count(*) from saved_places"))
              await engine.dispose()
              print(f"Baglanti tamam: {places} yer, {saved} kayitli yer")
          asyncio.run(main())
          PY

      - name: OSM ingest
        if: ${{ !inputs.kontrol }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.ingest --all ${{ inputs.force && '--force' || '' }}

      # Overture eski surumleri S3'ten siliyor; sabit surum birkac ay
      # icinde bozulurdu. En yeni tam surum her seferinde bulunuyor.
      - name: En yeni Overture surumu
        if: ${{ !cancelled() && !inputs.kontrol }}
        run: |
          release=$(curl -fsS "https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" \
            | grep -oE 'release/[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+/' | sort | tail -1 | cut -d/ -f2)
          test -n "$release" || { echo "::error::Overture surumu bulunamadi"; exit 1; }
          echo "Overture surumu: $release"
          echo "OVERTURE_RELEASE=$release" >> "$GITHUB_ENV"

      - name: Overture zenginlestirme
        if: ${{ !cancelled() && !inputs.kontrol }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.overture_ingest --all
