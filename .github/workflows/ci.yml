name: CI

on:
  pull_request:
  push:
    branches: [main]

# Is akisinin GitHub anahtari yalnizca kodu okuyabilir (yazma, surum, paket yok).
permissions:
  contents: read

# Eylemler etiket yerine commit SHA'sina sabit: etiket sonradan baska bir
# commit'e tasinabilir (tj-actions/changed-files, Mart 2025). Guncellerken
# yorumdaki surumun SHA'sini yazin.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hash'li kilit: her paket beklenen dosyayla birebir ayni olmali.
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test with coverage guard
        run: pytest --cov --cov-fail-under=79

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Surum package.json'daki packageManager alanindan okunuyor.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --prod
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
