name: CI

on:
  pull_request:
  push:
    branches: [main]

# Is akisinin GitHub anahtari yalnizca kodu okuyabilir (yazma, surum, paket yok).
permissions:
  contents: read

# Eylemler etiket yerine commit SHA'sina sabit: etiket sonradan baska bir
# commit'e tasinabilir (tj-actions/changed-files, Mart 2025). Guncellerken
# yorumdaki surumun SHA'sini yazin.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Hash'li kilit: her paket beklenen dosyayla birebir ayni olmali.
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test with coverage guard
        run: pytest --cov --cov-fail-under=79

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Surum package.json'daki packageManager alanindan okunuyor.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --prod
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
