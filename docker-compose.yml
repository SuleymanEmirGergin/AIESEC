# Not: Servisler birbirine servis adiyla ve IC portla erisir (backend:8000);
# host'a acilan portlar (3004/8004) yalnizca disaridan erisim icindir.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
      # Container agi: 'localhost' degil servis adi kullanilir
      - NEXT_PUBLIC_API_BASE=http://backend:8000/api
      - REDIS_URL=redis://redis:6379
      # Not: frontend artik Overpass'e dogrudan gitmiyor; tum aramalar
      # backend uzerinden geciyor. Mirror listesi backend/.env icinde
      # OVERPASS_URLS olarak failover'li tanimli.
      #
      # NEXT_PUBLIC_DEFAULT_LAT/LNG/ZOOM buradan kaldirildi: hicbir kod
      # onlari okumuyordu. Harita baslangic konumu src/app/page.tsx
      # icinde sabit; degistirmek gerekirse orasi degisir.
    env_file:
      # SEARCH_API_KEY gibi yerel degerler icin; yoksa sorun degil
      - path: .env.local
        required: false
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 sart: 'localhost' container icinde once ::1'e cozuluyor,
      # Next standalone sunucusu ise yalnizca 0.0.0.0 (IPv4) dinliyor.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    environment:
      # Tarayici backend'e dogrudan gitmiyor (tum istekler Next.js
      # sunucusundan geciyor), yani CORS pratikte devreye girmiyor. Yine de
      # backend'i disariya acarsaniz izinli origin listesi burasidir.
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3004
      # SQLite dosyasi volume'a tasindi. Varsayilan ./storage.db container
      # katmaninda duruyordu; her yeniden yaratmada API anahtarlari,
      # raporlar ve override'lar siliniyordu.
      - DATABASE_URL=sqlite+aiosqlite:////app/data/storage.db
      # LOG_LEVEL ve WARMUP_ENABLED buradan kaldirildi. LOG_LEVEL'i hicbir
      # kod okumuyordu; WARMUP_ENABLED'in baktigi warmup servisi ise
      # ilce bazli ingest'e gecerken silindi (commit ef8e265).
    volumes:
      - backend_data:/app/data
    env_file:
      # ADMIN_API_KEY ve OVERPASS_URLS burada. Imaja gomulmez, calisma aninda enjekte edilir.
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # Not: redis yalnizca onbellek; kalici veri tutmuyor, volume gerekmiyor.
    # container_name kullanilmiyor: sabit isim, ayni isimli eski container'larla
    # cakisiyor ve olceklemeyi engelliyor. Compose otomatik isimlendirsin.
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  backend_data:
