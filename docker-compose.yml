# Not: Servisler birbirine servis adiyla ve IC portla erisir (backend:8000);
# host'a acilan portlar (3004/8004) yalnizca disaridan erisim icindir.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
      # Container agi: 'localhost' degil servis adi kullanilir
      - NEXT_PUBLIC_API_BASE=http://backend:8000/api
      - REDIS_URL=redis://redis:6379
      - OVERPASS_URL=${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      - NEXT_PUBLIC_DEFAULT_LAT=${NEXT_PUBLIC_DEFAULT_LAT:-41.0082}
      - NEXT_PUBLIC_DEFAULT_LNG=${NEXT_PUBLIC_DEFAULT_LNG:-28.9784}
      - NEXT_PUBLIC_DEFAULT_ZOOM=${NEXT_PUBLIC_DEFAULT_ZOOM:-12}
    env_file:
      # SEARCH_API_KEY gibi yerel degerler icin; yoksa sorun degil
      - path: .env.local
        required: false
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    environment:
      - LOG_LEVEL=info
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3004
    env_file:
      # ADMIN_API_KEY ve OVERPASS_URLS burada. Imaja gomulmez, calisma aninda enjekte edilir.
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # container_name kullanilmiyor: sabit isim, ayni isimli eski container'larla
    # cakisiyor ve olceklemeyi engelliyor. Compose otomatik isimlendirsin.
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
